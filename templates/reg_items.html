{% extends "index.html" %}
{% block section %}
<h2>Register a product</h2>
<form action="/submit_item_post" method="post" enctype="multipart/form-data">
  <label>Product name: <input type="text" name="name" required></label><br>
  <label>Seller ID: <input type="text" name="seller" required></label><br>
  <label>Address: <input type="text" name="addr"></label><br>
  <label>Price: <input type="number" name="price" min="0"></label><br>
  <label>Status:
    <select name="status">
      <option value="Likely New">Likely New</option>
      <option value="Used">Used</option>
      <option value="Unopened">Unopened</option>
    </select>
  </label><br>
  <label>Email: <input type="email" name="email"></label><br>
  <label>Representative image: <input type="file" name="file" accept="image/*" required></label><br>
  <button type="submit">Submit!</button>
</form>
{% endblock %}
