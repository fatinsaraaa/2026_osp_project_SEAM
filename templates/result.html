{% extends "index.html" %}
{% block section %}
<h2>Registered product</h2>
<table class="result">
  <tr><th>Product name</th><td>{{ data.name }}</td></tr>
  <tr><th>Seller ID</th><td>{{ data.seller }}</td></tr>
  <tr><th>Address</th><td>{{ data.addr }}</td></tr>
  <tr><th>Price</th><td>{{ data.price }}</td></tr>
  <tr><th>Status</th><td>{{ data.status }}</td></tr>
  <tr><th>Email</th><td>{{ data.email }}</td></tr>
  <tr><th>Picture</th><td><img src="{{ url_for('static', filename=img_path) }}" width="200"></td></tr>
</table>
{% endblock %}
